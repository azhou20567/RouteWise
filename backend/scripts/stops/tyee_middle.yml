# Tyee Middle School — Bellevue School District
#
# The demo originally referenced "Newport Middle School" but no school by
# that name exists in BSD. Tyee Middle School is the BSD middle school
# serving the Newport area catchment (Somerset, Newport Hills, Coal Creek,
# Eastgate, Newport Shores). Stops verified against BSD's 2025-26 Tyee
# routes PDF (regenerated 2025-09-26).

dataset_id: bellevue_middle
name: Tyee Middle School
school_name: Tyee Middle School
school_level: middle
school_address: "13630 SE Allen Rd, Bellevue, WA 98006"
# school_lat / school_lng omitted — the build script geocodes.

stop_id_prefix: "BM-S"
route_id_prefix: "BM-R"

source_name: "Bellevue School District 2025-26 Tyee route PDF"
source_url: "https://resources.finalsite.net/images/v1758907001/bsd405org/y55o3s5unq96tytrq9a3/TYEE.pdf"
source_version: "2025-26 school year, generated 2025-09-26"
source_notes: >
  All 20 stops are verified against BSD's public 2025-26 Tyee routes PDF
  (BSD routes #32, #34, #39, #40, #41, #48). Lat/lng are geocoded from
  intersection names — BSD does not publish coordinates. The dataset
  previously labeled "Newport Middle School" has been corrected to Tyee
  Middle, which is the actual BSD middle school for this catchment.

bus_capacity: 78
max_vehicles: 5
departure_window: "07:30-08:30"
peak_window_label: "07:00-09:00"


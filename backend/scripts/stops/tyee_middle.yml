traffic_context:
  notes: >
    Somerset and Lakemont neighborhoods sit on steep grades that slow buses
    in winter. The I-90 / Lakemont Blvd interchange (Z4) and Factoria
    Blvd (Z1) are the morning peak chokepoints.
  zones:
    Z1: { congestion_level: "high",   peak_delay_minutes: 5.5 }
    Z2: { congestion_level: "medium", peak_delay_minutes: 3.0 }
    Z3: { congestion_level: "medium", peak_delay_minutes: 3.5 }
    Z4: { congestion_level: "high",   peak_delay_minutes: 6.0 }

demand_context:
  total_enrolled: 880
  bus_eligible_pct: 0.58
  notes: >
    Enrollment from OSPI 2024-25 report card for Tyee MS. Bus eligibility
    is the BSD 1.5-mile rule applied across the Newport-area catchment.

